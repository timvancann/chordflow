name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-cliff reads the commit history to build the release notes.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Build macOS Bundle
        run: cd chordflow_desktop && dx bundle --release --platform desktop

      - name: Fix executable permissions and re-sign app bundle
        run: |
          # Match any .app under target/dx rather than a hardcoded nesting.
          # The previous pattern pinned an exact "bundle/macos/bundle/macos"
          # path that the Dioxus CLI no longer produces, so this silently
          # resolved to an empty string and chmod failed with a confusing
          # error two lines later. Fail loudly instead.
          APP_PATH=$(find target/dx -type d -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found under target/dx"
            echo "Directories present, for diagnosis:"
            find target/dx -maxdepth 8 -type d | head -60
            exit 1
          fi
          echo "Processing app bundle: $APP_PATH"

          # Fix executable permissions (often lost during bundling)
          echo "Setting executable permissions..."
          chmod +x "$APP_PATH/Contents/MacOS/"*
          ls -la "$APP_PATH/Contents/MacOS/"

          # Verify architecture
          echo "Verifying architecture..."
          EXECUTABLE=$(find "$APP_PATH/Contents/MacOS" -type f -perm +111 | head -1)
          file "$EXECUTABLE"

          # Ad-hoc sign properly (instead of removing signature)
          echo "Ad-hoc signing bundle..."
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --verbose "$APP_PATH"

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Find DMG file
        id: find_dmg
        run: |
          DMG_PATH=$(find target/dx -type f -name "*.dmg" | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::No .dmg found under target/dx"
            find target/dx -maxdepth 8 -type f -name "*.dmg" -o -maxdepth 8 -type d | head -60
            exit 1
          fi
          DMG_NAME=$(basename "$DMG_PATH")
          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_OUTPUT

      # git-cliff is run directly rather than through git-cliff-action, whose
      # run.sh sizes its output with GNU `stat -c %s`. macOS stat wants -f %z,
      # so the check errors, the `content` output is never set, and the step
      # still reports success — an empty changelog with a green tick.
      - name: Install git-cliff
        run: brew install git-cliff

      - name: Build release notes
        run: |
          {
            git-cliff --config cliff.toml --latest --strip header
            cat <<'NOTES'

          ## Opening the app on macOS

          This build is ad-hoc signed and not notarized by Apple, so the first launch is
          blocked by Gatekeeper ("ChordFlow is damaged and can't be opened"). After
          installing, remove the quarantine flag once:

          ```
          xattr -d com.apple.quarantine /Applications/ChordFlow.app
          ```
          NOTES
          } > RELEASE_NOTES.md

          echo "--- release notes ---"
          cat RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.find_dmg.outputs.DMG_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
